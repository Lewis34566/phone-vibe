<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090a10">
<title>清除旧缓存 · 手机版 Agent</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#090a10; color:#e6e8f0; font:16px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif;
    padding:24px; box-sizing:border-box; }
  .card { max-width:420px; width:100%; background:#151825; border:1px solid #232840; border-radius:16px; padding:24px; }
  h1 { font-size:19px; margin:0 0 12px; }
  ul { margin:0 0 16px; padding-left:20px; color:#a7adc0; font-size:14px; }
  li { margin:6px 0; }
  .ok { color:#4ade80; } .err { color:#f87171; }
  a.btn { display:block; text-align:center; text-decoration:none; padding:14px; border-radius:12px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; font-weight:600; margin-top:8px; }
  #log { font-size:13px; color:#8b93a7; margin-top:12px; word-break:break-all; }
</style>
</head>
<body>
<div class="card">
  <h1>🧹 清除旧缓存</h1>
  <ul>
    <li>注销旧 Service Worker</li>
    <li>清空离线缓存（页面 / 脚本）</li>
    <li>自动跳到最新界面</li>
  </ul>
  <div id="log">正在清理…</div>
  <a class="btn" id="go" href="/?v=192">前往最新界面 →</a>
</div>
<script>
(async function () {
  const log = document.getElementById('log');
  const lines = [];
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
      lines.push('✅ 已注销 Service Worker（' + regs.length + ' 个）');
    }
    if (window.caches) {
      const keys = await caches.keys();
      for (const k of keys) await caches.delete(k);
      lines.push('✅ 已清空缓存（' + keys.length + ' 个）');
    }
    lines.push('3 秒后自动跳转…');
    log.className = 'ok';
    setTimeout(() => { location.replace('/?v=192'); }, 3000);
  } catch (e) {
    lines.push('⚠️ 清理出错：' + e.message + '（直接点下面的按钮也行）');
    log.className = 'err';
  }
  log.innerHTML = lines.join('<br>');
})();
</script>
</body>
</html>
