<body>
<div class="card">
  <h1>📴 服务没在跑</h1>
  <p>手机上的 Agent 服务被系统停掉了（息屏省电/清理后台时会这样），手机系统后台把服务杀了——你的数据和项目都在，放心。</p>
  <p>两步救回来：</p>
  <p>1️⃣ 打开 Termux</p>
  <p>2️⃣ 执行：<code>cd ~/手机版Agent && bash start.sh bg</code></p>
  <p>然后回到本页点下面的按钮重试：</p>
  <a class="btn" href="/?v=19">🔄 重新连接</a>
  <p class="dim">提示：在手机「设置 → 省电与电池 → Termux 设为无限制」+ 最近任务里把 Termux 卡片下拉锁住，能大大减少被杀。</p>
</div>
