<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090a10">
<title>手机版 Agent · Lewis</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="手机版 Agent">
<meta name="apple-mobile-web-app-title" content="手机版 Agent">
<link rel="stylesheet" href="/style.css?v=1.95">
</head>
<body>
<div id="keyBanner" class="hidden">
  <div class="keybanner-inner">
    <span>🔑 还没有配置 API Key</span>
    <input id="keyInput" type="password" placeholder="粘贴 sk-... 只保存在本机">
    <button id="keySave">保存</button>
  </div>
</div>
<header>
  <div class="logo">&gt;_</div>
  <button id="projectPill" class="project-pill">
    <span class="pname" id="pname">选择项目</span><span class="car">▾</span>
  </button>
  <button class="iconbtn" id="btnNewChat" title="新聊天">＋</button>
  <button class="iconbtn hidden" id="btnInstall" title="安装到桌面">📲</button>
  <button class="iconbtn" id="btnHistory" title="会话历史">🕘</button>
  <button class="iconbtn" id="btnSettings" title="设置">⚙️</button>
</header>
<main>
  <section id="viewChat">
    <div id="log">
      <div id="landing" class="landing">
        <div class="lewis-avatar">L</div>
        <h2>你好，我是 Lewis</h2>
        <p>用中文说个需求，我就在你手机上把软件做出来</p>
        <div class="chips">
          <button class="chip">💰 做一个记账小工具</button>
          <button class="chip">✅ 做一个待办清单</button>
          <button class="chip">🎲 做一个抽签转盘</button>
          <button class="chip">📝 做一个备忘录</button>
        </div>
        <div class="ver" id="ver"></div>
      </div>
    </div>
    <div id="imgRow" class="img-row hidden"></div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="说一个需求…"></textarea>
      <button id="attach" class="send-btn ghost" title="传文件">📎</button>
      <button id="cam" class="send-btn ghost" title="拍照/传图">📷</button>
      <button id="mic" class="send-btn ghost" title="语音输入">🎤</button>
      <button id="send" class="send-btn" title="发送">➤</button>
      <button id="cancel" class="hidden" title="停止">⏹</button>
    </div>
  </section>
</main>
<div id="sheet" class="sheet hidden"><div id="sheetCard" class="sheet-card"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js?v=1.95"></script>
</body>
</html>
