<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>手机版 Agent · 手机本机编程</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="keyBanner" class="hidden">
  <div class="keybanner-inner">
    <span>🔑 还没有 Claude API Key（演示模式也可先玩）</span>
    <input id="keyInput" type="password" placeholder="粘贴 sk-ant-... 只保存在本机">
    <button id="keySave">保存</button>
  </div>
</div>
<header>
  <button class="iconbtn" id="btnProjects" title="项目列表">🗂</button>
  <div class="title"><h1>手机版 Agent</h1><div id="projectName" class="project-name">—</div></div>
  <button class="iconbtn" id="btnHistory" title="会话历史">🕘</button>
</header>
<main>
  <section id="viewChat">
    <div id="log"></div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="说一个需求，例如：做一个记账小工具"></textarea>
      <button id="send">发送</button>
      <button id="cancel" class="hidden">停止</button>
    </div>
  </section>
  <section id="viewProjects" class="hidden">
    <form id="newProjectForm">
      <input id="newProjectName" placeholder="新项目名，如：记账本" required>
      <button type="submit">＋ 新建</button>
    </form>
    <div id="projectList"></div>
    <div id="lanInfo" class="lan-info"></div>
  </section>
</main>
<div id="modal" class="hidden"><div id="modalCard"></div></div>
<script src="/app.js"></script>
</body>
</html>
